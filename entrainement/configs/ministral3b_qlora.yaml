# QLoRA (poids 4 bits NF4 + LoRA) : ~3 Go de poids, laisse de la marge pour des séquences longues
# ou un batch plus gros. Légèrement moins précis et plus lent par pas que la LoRA bf16.

model:
  name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  load_in_4bit: true
  attn_implementation: sdpa
  dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05

data:
  # Jeu d'affinage du dépôt (format « messages », découpé par l'agent de préparation du corpus).
  train_files: [data/sft/train.jsonl]
  eval_files: [data/sft/val.jsonl]     # perte d'évaluation, sonde qualité, choix du meilleur checkpoint
  test_files: [data/sft/test.jsonl]    # évaluation finale uniquement
  drop_train_groups_in_eval: false     # les domaines sont larges et partagés par le découpage fourni
  # Paires pilotes (champs id / specification / gherkin) : train_files: [data/pilote/gherkin_fr_*.jsonl],
  # eval_files: [], test_files: [], metadata_files: [data/pilote/regles_20.jsonl] et découpage automatique.
  group_by: [dispositif, domaine, groupe, source]
  eval_ratio: 0.1
  require_valid_gherkin: true
  min_reference_score: 0.0
  max_length: 3072
  seed: 42

training:
  output_dir: entrainement/runs/ministral3b-gherkin-qlora
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  eval_steps: 50
  metric_for_best_model: eval_loss
  report_to: [tensorboard]

eval:
  batch_size: 8
  probe_samples: 16
